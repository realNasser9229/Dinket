<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinket | Next-Gen Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #7C3AED;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --bg: #0F172A;
            --surface: #1E293B;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- LOGIN OVERLAY --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .login-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        .login-card h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #A78BFA, #60A5FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card input {
            width: 100%;
            padding: 12px 20px;
            margin: 1.5rem 0;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0F172A;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .login-card input:focus { border-color: var(--accent); }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* --- MAIN LAYOUT --- */
        .app-shell {
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            display: grid;
            grid-template-columns: 280px 1fr;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: rgba(15, 23, 42, 0.5);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .brand { font-weight: 800; font-size: 1.5rem; margin-bottom: 2rem; color: var(--accent); }
        
        .user-list-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 1rem; }
        
        #user-list { list-style: none; }
        .user-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; }
        .status-dot { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; box-shadow: 0 0 8px #22C55E; }

        /* --- CHAT AREA --- */
        .main-chat {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(255,255,255,0.02);
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Custom Scrollbar */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Message Bubbles */
        .msg { max-width: 65%; position: relative; animation: slideUp 0.3s ease-out; }
        
        .msg-content {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .msg-info { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; display: block; }

        .received { align-self: flex-start; }
        .received .msg-content { background: var(--surface); border-bottom-left-radius: 4px; }

        .sent { align-self: flex-end; }
        .sent .msg-content { 
            background: linear-gradient(135deg, #7C3AED, #4F46E5); 
            color: white; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .system { align-self: center; font-size: 0.75rem; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 24px 30px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            gap: 15px;
        }

        #message-input {
            flex-grow: 1;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px 20px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        #message-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .app-shell { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>Dinket</h1>
            <p style="color: var(--text-dim)">The future of connection.</p>
            <form id="login-form">
                <input type="text" id="username-field" placeholder="Pick a username..." required maxlength="12" autocomplete="off">
                <button type="submit" class="btn-primary">Enter Dinket</button>
            </form>
        </div>
    </div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Dinket.</div>
            <div class="user-list-label">Online Users</div>
            <ul id="user-list">
                <li class="user-item"><span class="status-dot"></span> You</li>
            </ul>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <div>
                    <h2 id="room-name" style="font-size: 1.1rem;">Global Lounge</h2>
                    <span style="font-size: 0.75rem; color: #22C55E;">● Active connection</span>
                </div>
            </header>

            <div id="messages">
                </div>

            <form class="input-area" id="chat-form">
                <input type="text" id="message-input" placeholder="Message Global Lounge..." autocomplete="off">
                <button type="submit" class="btn-primary" style="width: auto;">Send</button>
            </form>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // DOM Elements
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const usernameField = document.getElementById('username-field');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messagesBox = document.getElementById('messages');

        let myName = "";

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            myName = usernameField.value.trim();
            if(myName) {
                loginOverlay.style.display = 'none';
                socket.emit('join', myName);
                messageInput.focus();
            }
        });

        // Handle Chat Sending
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if(text) {
                socket.emit('chat message', text);
                messageInput.value = '';
            }
        });

        // Receiving Messages
        socket.on('chat message', (data) => {
            const div = document.createElement('div');
            const isMe = data.id === socket.id;
            
            div.className = `msg ${isMe ? 'sent' : 'received'}`;
            div.innerHTML = `
                ${isMe ? '' : `<span class="msg-info">${data.user}</span>`}
                <div class="msg-content">
                    ${data.text}
                    <span style="display:block; font-size: 0.6rem; margin-top: 4px; opacity: 0.6; text-align: right;">${data.time}</span>
                </div>
            `;
            
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });

        // Receiving System Messages
        socket.on('system message', (text) => {
            const div = document.createElement('div');
            div.className = 'msg system';
            div.innerText = text;
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });
    </script>
</body>
    </html>
