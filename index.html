<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinket | Future Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B5CF6; /* Electric Purple */
            --secondary: #06B6D4; /* Cyber Blue */
            --bg-dark: #020617;
            --surface: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- LOGIN SCREEN --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-card h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .login-card input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
            outline: none;
            margin-bottom: 1.5rem;
        }

        .login-card input:focus { border-color: var(--primary); }

        /* --- MAIN APP SHELL --- */
        .app-container {
            width: 95vw;
            max-width: 1100px;
            height: 85vh;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            display: grid;
            grid-template-columns: 260px 1fr;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(15, 23, 42, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 2rem; color: var(--primary); }

        .online-status { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 1rem; }

        #user-list { list-style: none; }
        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; box-shadow: 0 0 10px #10B981; }

        /* Chat Window */
        .chat-view { display: flex; flex-direction: column; height: 100%; }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Message Bubbles */
        .msg { max-width: 70%; position: relative; animation: popIn 0.3s ease-out; }

        .msg-bubble {
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .sent { align-self: flex-end; }
        .sent .msg-bubble { 
            background: linear-gradient(135deg, var(--primary), #6366F1);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .received { align-self: flex-start; }
        .received .msg-bubble { 
            background: #334155; 
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .system { align-self: center; font-size: 0.75rem; color: var(--text-dim); }

        .meta { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; display: block; }

        /* Input Area */
        .input-bar {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            gap: 1rem;
        }

        #msg-input {
            flex-grow: 1;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1rem;
            color: white;
            outline: none;
            transition: 0.2s;
        }

        #msg-input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Scrollbar */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .app-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>Dinket</h1>
            <p style="color: var(--text-dim); margin-bottom: 2rem;">Next-generation messaging.</p>
            <input type="text" id="username-in" placeholder="Pick a username" maxlength="12">
            <button onclick="startDinket()" style="width: 100%; padding: 1rem;">Join Lounge</button>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <h2>Dinket.</h2>
            <p class="online-status">Global Lounge</p>
            <div id="user-list">
                <div class="user-pill"><span class="dot"></span> Everyone</div>
            </div>
        </aside>

        <main class="chat-view">
            <header>
                <div>
                    <h3 id="current-user-tag">Lobby</h3>
                    <p style="font-size: 0.7rem; color: #10B981;">● Online</p>
                </div>
            </header>

            <div id="messages">
                </div>

            <form class="input-bar" id="chat-form">
                <input type="text" id="msg-input" placeholder="Type something..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const messagesBox = document.getElementById('messages');
        let myUsername = "";

        function startDinket() {
            const name = document.getElementById('username-in').value.trim();
            if(name) {
                myUsername = name;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('current-user-tag').innerText = `Logged in as ${name}`;
                socket.emit('join', name);
                msgInput.focus();
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if(msgInput.value.trim()) {
                socket.emit('chat message', msgInput.value);
                msgInput.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const div = document.createElement('div');
            const isMe = data.id === socket.id;
            
            div.className = `msg ${isMe ? 'sent' : 'received'}`;
            div.innerHTML = `
                ${isMe ? '' : `<span class="meta">${data.user}</span>`}
                <div class="msg-bubble">
                    ${data.text}
                    <span style="display:block; font-size: 0.6rem; opacity: 0.5; margin-top: 5px; text-align: right;">${data.time}</span>
                </div>
            `;
            
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });

        socket.on('system message', (text) => {
            const div = document.createElement('div');
            div.className = 'msg system';
            div.innerText = text;
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        });
    </script>
</body>
</html>
